parameters:
  - rule_id: COST-EQ-UPPER-BOUND
    parameter: unverified_period_multiplier
    value: "1.5"
    effective_from: 2026-10-16
    source_url: doc:docs/research/wave1/research-backtest-method.md#61-equity-delivery-and-etf-cash-market--rates-as-published-today
    verification_status: PARAMETER
    notes: >-
      A backtest period without a verified cost row uses today's rates x 1.5 as a conservative upper bound and is
      flagged costs_estimated (or abstains).
