  # ---------------- Other (non-equity-oriented, non-specified) MFs ----------------------------------
  # Gold FoF, international FoF, balanced/multi-asset with ≤65 % debt.  Only UNLISTED units are covered:
  # whether listed non-equity ETF units take 12 or 24 months is NOT VERIFIED, so listed ones abstain.
  - rule_id: MF-OTHER-ST/ITA1961
    act: ITA1961
    section_1961: null
    section_2025: null
    instrument_class: MUTUAL_FUND
    conditions: {listed: false, domestic_equity_share_below: "0.65", debt_share_max: "0.65"}
    holding_threshold_months: 24
    gain_type: STCG
    rate: SLAB
    effective_from: 2025-04-01
    effective_to: 2026-03-31
    source_url: https://egazette.gov.in/WriteReadData/2024/256436.pdf
    verification_status: P
    notes: >-
      PRIMARY [FA24] s.3(b) (s.2(42A)): 24 months for assets outside the 12-month proviso; [MEMO24]: "For all listed
      securities, the holding period is proposed to be 12 months and for all other assets, it shall be 24 months".
      An unlisted non-equity, non-specified fund unit (e.g. gold or international FoF) is therefore short-term up to
      24 months. Classification follows s.50AA Explanation (ii) ([FA24] s.21(b)): not specified when debt <= 65 %
