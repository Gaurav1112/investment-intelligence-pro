# Indian tax rule table — ADR-0009.  Source of every row: docs/research/indian-instruments-and-tax.md §7-§8
# (Agent B, research snapshot 2026-10-15).  NOT TAX ADVICE: every rule needs Chartered Accountant sign-off.
#
# Conventions
# * verification_status: P = VERIFIED-PRIMARY, S = VERIFIED-SECONDARY, NV = NOT VERIFIED.
#   A row with mixed status in the research takes the WEAKEST status.  NV rows stay NV until a CA signs off,
#   OR until the statute itself is read: a row may be upgraded to P only with a citation (URL + section/clause +
#   a short quoted phrase) to a primary text that was actually read (Track 6, 2026-10-15; see
#   docs/finance/ca-review-packet.md §1 for the source list and the SHA-256 of every document read).
# * Primary texts read in Track 6 (short names used in notes below):
#   [ITA25]  Income-tax Act 2025 as amended by Finance Act 2026, CBDT consolidated text,
#            https://www.incometaxindia.gov.in/documents/d/guest/income_tax_act_2025_as_amended_by_fa_act_2026-pdf
#            (direct fetch HTTP 403; read via web.archive.org snapshot 20260612085646 of that exact URL).
#   [FA26]   Finance Act 2026 (No. 4 of 2026), Gazette CG-DL-E-31032026-271439,
#            https://www.incometaxindia.gov.in/documents/d/guest/finance-act-2026-pdf-1 (via snapshot 20261006014925).
#   [FA24]   Finance (No. 2) Act 2024 (No. 15 of 2024), https://egazette.gov.in/WriteReadData/2024/256436.pdf
#   [FA25]   Finance Act 2025 (No. 7 of 2025), Gazette CG-DL-E-29032025-262125, Gazette copy on a government
#            host: https://thc.nic.in/Central%20Governmental%20Acts/Finance%20Act,%202025.pdf
#   [ITA61]  Income-tax Act 1961, India Code, https://www.indiacode.nic.in/bitstream/123456789/2435/1/a1961-43.pdf
#            (via snapshot 20260111174633; this consolidation predates the 2024-25 amendments, so it is used only
#            for text those amendments did not touch).
#   [MEMO24] Finance (No.2) Bill 2024 memorandum, https://www.indiabudget.gov.in/budget2024-25/doc/memo.pdf
# * Changing a value: edit the row (or close it with effective_to and add a new row), bump table_version,
#   and add a regression test in tests/unit/test_tax.py or tests/unit/test_rules_loader.py.
# * Rows are split per Act: income on/before 2026-03-31 → ITA1961, from 2026-04-01 → ITA2025.  Split rows
#   carry the research rule_id plus "/ITA1961" or "/ITA2025" (tables: "/FY2025-26", "/TY2026-27").
# * effective_from/effective_to are TRANSFER (income) dates, inclusive.  effective_to: null = in force at snapshot.
# * Where the research gives no start date ("(pre-2024)", "(in force)", "—") effective_from is set to
#   2024-04-01, the start of FY2024-25, the earliest year the research table covers.  This is a deliberate
#   NARROWING: earlier transfers abstain (RuleNotFound) instead of borrowing a rate the research never checked.
# * rate: base rate before surcharge and cess, as a quoted decimal fraction; or "SLAB" / "EXEMPT".
# * holding_threshold_months: the period that must be EXCEEDED for LTCG.  null = no holding test.
# * Decimals are quoted strings (the loader rejects floats).

schema_version: 1
# Bumped on every change to a value, condition or status (not on note-only edits).  r2 = Track 6 verification.
table_version: india-tax@2026-10-15.r2
jurisdiction: IN
snapshot_date: 2026-10-15
# Last day for which the research states rates (end of Tax Year 2026-27).  Later transfers abstain.
coverage_to: 2027-03-31

acts:
  - rule_id: LAW-ITA61
    act: ITA1961
    effective_from: null
    effective_to: 2026-03-31
    source_url: https://www.incometaxindia.gov.in/documents/d/guest/income_tax_act_2025_as_amended_by_fa_act_2026-pdf
    verification_status: P
    notes: >-
      PRIMARY [ITA25] s.536(1): "The Income-tax Act, 1961 (43 of 1961) is hereby repealed."; s.536(2)(c) keeps the
      repealed Act for "any tax year beginning before the 1st April, 2026". Income up to 31-Mar-2026 therefore stays
      under the 1961 Act. Start date not recorded (precedes every rule in this file).
  - rule_id: LAW-ITA25
    act: ITA2025
    effective_from: 2026-04-01
    effective_to: null
    source_url: https://www.incometaxindia.gov.in/documents/d/guest/income_tax_act_2025_as_amended_by_fa_act_2026-pdf
    verification_status: P
    notes: >-
      PRIMARY [ITA25] s.1(3): "Save as otherwise provided in this Act, it shall come into force on the 1st April,
      2026." Corroborated by the Gazette text as enacted (Act 30 of 2025, assent 21-Aug-2025, Gazette
      CG-DL-E-22082025-265620). "Tax year" replaces previous/assessment year.

