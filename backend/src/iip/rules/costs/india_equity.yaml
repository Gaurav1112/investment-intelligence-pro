# Cash-market equity delivery and ETF transaction costs — research-backtest-method.md §6.1; verify BT-4; package A11.
#
# Same conventions as tax/india.yaml: every row has rule_id, effective_from (inclusive), effective_to (null = in
# force at snapshot), source_url and verification_status; decimals are quoted strings (floats are refused).
# * effective_from is the date the rate was OBSERVED on the cited page (2026-10-15), not the date it started.
#   Rates before that date are NOT VERIFIED here: a backtest period without a row must use the upper-bound rule
#   (COST-EQ-UPPER-BOUND, flagged costs_estimated) or abstain.
# * rate is a fraction of `basis`; amount_inr is a flat rupee charge.  A row with neither must be
#   REQUIRES_CONFIGURATION (broker-specific, the user supplies it) or NV (no verified rate).
# * The broker page (Zerodha) is a SECONDARY source; regulator/statute texts were not opened (status S).
# * ETFs: the broker page does not mention ETFs at all; only the STT row is listed for them and it is NV.

schema_version: 1
table_version: india-equity-costs@2026-10-16.r1
snapshot_date: 2026-10-15

