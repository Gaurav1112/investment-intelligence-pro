# Indian tax rule table — ADR-0009.  Source of every row: docs/research/indian-instruments-and-tax.md §7-§8
# (Agent B, research snapshot 2026-10-15).  NOT TAX ADVICE: every rule needs Chartered Accountant sign-off.
#
# Conventions
# * verification_status: P = VERIFIED-PRIMARY, S = VERIFIED-SECONDARY, NV = NOT VERIFIED.
#   A row with mixed status in the research takes the WEAKEST status.  NV rows stay NV until a CA signs off.
# * Rows are split per Act: income on/before 2026-03-31 → ITA1961, from 2026-04-01 → ITA2025.  Split rows
#   carry the research rule_id plus "/ITA1961" or "/ITA2025" (tables: "/FY2025-26", "/TY2026-27").
# * effective_from/effective_to are TRANSFER (income) dates, inclusive.  effective_to: null = in force at snapshot.
# * Where the research gives no start date ("(pre-2024)", "(in force)", "—") effective_from is set to
#   2024-04-01, the start of FY2024-25, the earliest year the research table covers.  This is a deliberate
#   NARROWING: earlier transfers abstain (RuleNotFound) instead of borrowing a rate the research never checked.
# * rate: base rate before surcharge and cess, as a quoted decimal fraction; or "SLAB" / "EXEMPT".
# * holding_threshold_months: the period that must be EXCEEDED for LTCG.  null = no holding test.
# * Decimals are quoted strings (the loader rejects floats).

schema_version: 1
jurisdiction: IN
snapshot_date: 2026-10-15
# Last day for which the research states rates (end of Tax Year 2026-27).  Later transfers abstain.
coverage_to: 2027-03-31

acts:
  - rule_id: LAW-ITA61
    act: ITA1961
    effective_from: null
    effective_to: 2026-03-31
    source_url: https://www.incometaxindia.gov.in/documents/d/guest/press-release-income-tax-act-2025-comes-into-force-from-01-april-2026-pdf
    verification_status: S
    notes: >-
      Income up to 31-Mar-2026 is taxed under the Income-tax Act 1961. Start date not recorded in the research
      (precedes every rule in this file). Implied by LAW-ITA25.
