    act: ITA2025
    effective_from: 2026-04-01
    effective_to: null
    source_url: https://www.incometaxindia.gov.in/documents/d/guest/press-release-income-tax-act-2025-comes-into-force-from-01-april-2026-pdf
    verification_status: S
    notes: >-
      Income-tax Act 2025 in force from 1-Apr-2026 (commencement VERIFIED-SECONDARY, CBDT press release HTTP 403;
      FB2026 memo references to ss.196/197/198/202 VERIFIED-PRIMARY). "Tax year" replaces previous/assessment year.

