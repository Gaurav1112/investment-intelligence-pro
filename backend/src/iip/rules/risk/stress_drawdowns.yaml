# L3 stress table — design-risk-first.md §5.2, graft 4 of design-judgement.md §2.1; package A11.
#
# Each row is a HISTORICAL worst observed peak-to-trough fall for a risk class.  It is not a forecast: "the worst
# fall in the available history of X was Y", and the worst observed fall is not the worst possible fall.
#
# User decision U-08 (PLAN.md §3/§8, default "Local config"): the index-derived constants are NOT stored in this
# public file.  Rows with value_source LOCAL_CONFIG carry only the schema, the citation pointer and the status;
# their numbers are read from the user's local file
#     <IIP_DATA_DIR>/config/stress_drawdowns.local.yaml          (see loader.local_stress_values_path)
# with this shape (values are quoted decimal fractions; floats are refused):
#     schema_version: 1
#     values:
#       - risk_class: EQ_BROAD
#         stress: "0.xxx"            # fraction of value lost, (0, 1]
#         recovery_years: "x.x"      # optional, peak -> recovery, null when not recovered / unknown
# A LOCAL_CONFIG class with no local value is REQUIRES CONFIGURATION: its cited value is None and the engine
# (A12) uses the AMFI-recomputed drawdown alone or abstains.  Stress per class = max(cited, AMFI-recomputed).
# Why: the niftyindices terms forbid copying material without permission, and whether derived statistics fall
# under that clause is NOT VERIFIED (ADR-0017; verify MOM-8).
#
# Row fields (the loader rejects a row without source_url, verification_status or effective_from):
#   value_source  LOCAL_CONFIG | TABLE (value in this file) | ALIAS (another class × multiplier) | FORMULA
#   verification_status  P | S | NV (as the tax table) | PARAMETER (a fixed design choice, not a measurement)
#                        | REQUIRES_CONFIGURATION
#   back_calculated  the index history before its launch date is back-calculated by the index provider
#
# All equity classes are added with correlation 1 (no diversification credit) — enforced in engine/risk (A12).

schema_version: 1
table_version: stress-drawdowns@2026-10-16.r1
values_source_decision: U-08

